name: Build shader pack

# Started by hand (Actions -> Run workflow) or by pushing a release tag: no builds on other pushes or pull requests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to publish from this run (e.g. v3.5-fix2); empty = build only'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage pack files
        run: |
          mkdir -p pack
          cp -r shaders LICENSE LICENSE-APACHE "read before you edit.txt" PATCHES.md pack/

      # GitHub always zips artifacts on download, so upload the unpacked folder:
      # the downloaded "Mellow v3.5 Fix.zip" is then the shader pack itself
      # (shaders/ at its root), not a zip inside a zip.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow v3.5 Fix
          path: pack/
          retention-days: 14

      - name: Zip for release (tags or a manual run with a release tag)
        if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        run: cd pack && zip -qr "../Mellow v3.5 Fix.zip" .

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/') || inputs.release != ''
        uses: actions/attest@v4
        with:
          subject-path: 'Mellow v3.5 Fix.zip'

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "Mellow v3.5 Fix.zip"

      # A new tag makes a new release. An existing one is updated in place (there is only one Mellow
      # v3.5 Fix release): its tag moves to this commit and the zip is replaced.
      - name: Publish release (manual run with a release tag)
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" "Mellow v3.5 Fix.zip" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "Mellow v3.5 Fix.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Mellow v3.5 Fix ($TAG)" --notes "Mellow 3.5 by TheCMK with fixes for Voxy on Minecraft 26.3 and the flashing sky on 26.2 (see PATCHES.md), and a Hungarian settings menu. Not an official Mellow release."
          fi
