name: Build shader pack

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage pack files
        run: |
          mkdir -p pack
          cp -r shaders LICENSE LICENSE-APACHE "read before you edit.txt" PATCHES.md pack/

      # GitHub always zips artifacts on download, so upload the unpacked folder:
      # the downloaded "Mellow (Voxy Fix).zip" is then the shader pack itself
      # (shaders/ at its root), not a zip inside a zip.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow (Voxy Fix)
          path: pack/

      - name: Zip for release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: cd pack && zip -qr "../Mellow (Voxy Fix).zip" .

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "Mellow (Voxy Fix).zip"
