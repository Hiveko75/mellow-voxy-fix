name: Build shader pack zip

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          mkdir -p dist
          zip -qr "dist/Mellow-v3.5-voxyfix.zip" shaders LICENSE LICENSE-APACHE "read before you edit.txt" PATCHES.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mellow-v3.5-voxyfix
          path: dist/Mellow-v3.5-voxyfix.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mellow-v3.5-voxyfix.zip
